[package]
name = "mux-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "mattyx: tmux-like terminal multiplexer TUI backed by libghostty-vt"

[[bin]]
name = "mtyx"
path = "src/main.rs"

# Transition alias: the canonical binary is `mtyx`; `cmux` points at the
# same entry point so existing workflows keep working untouched.
[[bin]]
name = "cmux"
path = "src/main.rs"

[dependencies]
ghostty-vt.workspace = true
mux-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
anyhow.workspace = true
unicode-width.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
base64.workspace = true
libc.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
