name: PR Build

on:
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    types:
      - opened
      - synchronize
      - reopened
  # Manual trigger: the pull_request webhook for this repo has been
  # intermittently stuck (2026-07-09+); workflow_dispatch gives us a
  # reliable manual run path via `gh workflow run`.
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Bootstrap (fetch zig 0.15.2)
        run: |
          ./scripts/bootstrap.sh
          echo "ZIG=$GITHUB_WORKSPACE/.tools/zig-${{ matrix.arch }}-linux-0.15.2/zig" >> "$GITHUB_ENV"

      - name: Cargo check (mux-tui)
        working-directory: mux
        run: cargo check -p mux-tui

      - name: Cargo test (mux-tui)
        working-directory: mux
        run: cargo test -p mux-tui
