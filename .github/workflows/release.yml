name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        # ports.ubuntu.com (the arm64 mirror) is flaky enough on GitHub's
        # ARM runners to warrant a retry loop, not just a single attempt -
        # seen live on this repo's pr-build.yml (same step, same failure)
        # on two separate CI runs.
        run: |
          for i in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y clang libclang-dev; then
              exit 0
            fi
            echo "attempt $i failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "all 5 attempts failed" >&2
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: ./scripts/bootstrap.sh

      - name: Package binary
        run: |
          mkdir -p dist
          cp mux/target/release/cmux "dist/cmux-linux-${{ matrix.arch }}"
          chmod +x "dist/cmux-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cmux-linux-${{ matrix.arch }}
          path: dist/cmux-linux-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
