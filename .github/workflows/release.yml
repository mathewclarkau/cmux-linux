name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags are not fetched at the default depth, and
          # mux-core/build.rs falls back to `git describe` whenever
          # CMUX_VERSION is unset (i.e. workflow_dispatch runs). Tag refs
          # are a few KB — far cheaper than fetch-depth: 0, which would
          # also deepen the ghostty submodule.
          fetch-tags: true

      - name: Resolve version from the release tag
        # The pushed tag is the single source of truth for a release; no
        # human bumps anything in-tree. That is the whole fix for issue
        # #71 — mux-tui/Cargo.toml sat at 0.1.0 for seventeen releases
        # precisely because it relied on someone remembering.
        # mux-core/build.rs bakes $CMUX_VERSION into the binary; the
        # manifest rewrite on top keeps `cargo metadata` and build.rs's
        # own no-git fallback honest for this build. workflow_dispatch
        # runs have no tag, so this stays empty and build.rs falls
        # through to `git describe`.
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "not a tag build; leaving the version to git describe"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Anchored to the start of the line so it can only match
          # [workspace.package]'s own key, never a
          # `foo = { version = "1" }` dependency line.
          sed -i -E "0,/^version = \".*\"\$/s//version = \"$version\"/" mux/Cargo.toml
          grep -qx "version = \"$version\"" mux/Cargo.toml \
            || { echo "::error::failed to sync mux/Cargo.toml to $version"; exit 1; }
          echo "release version: $version"

      - name: Install build dependencies
        # ports.ubuntu.com (the arm64 mirror) has been fully unreachable
        # from GitHub's ARM runners (every IPv4/IPv6 address, every
        # retry) across multiple separate CI runs on this repo's
        # pr-build.yml - not a one-off blip, so retrying against the same
        # mirror doesn't help. Falls back to apt.llvm.org (LLVM's own
        # repo, different infra/CDN entirely) after a couple of quick
        # attempts against the default mirror. llvm.sh's own default
        # package set (clang/lldb/lld/clangd) pulls in lldb's
        # gRPC/protobuf deps from the *still-broken* Ubuntu repo -
        # confirmed live, llvm.sh itself exits non-zero over exactly that,
        # even though every apt.llvm.org package fetched fine. bindgen
        # only needs libclang.so discoverable + a resource-dir (see
        # ghostty-vt-sys/build.rs), so run llvm.sh just for its repo setup
        # (ignore its own install/exit code) and then install only
        # clang-18/libclang-18-dev ourselves - both live entirely on
        # apt.llvm.org, no ports.ubuntu.com dependency at all.
        run: |
          for i in 1 2; do
            if sudo apt-get update && sudo apt-get install -y clang libclang-dev; then
              exit 0
            fi
            echo "attempt $i against the default mirror failed, retrying in 10s..." >&2
            sleep 10
          done
          echo "default mirror unreachable after 2 attempts; falling back to apt.llvm.org" >&2
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18 || true
          sudo apt-get install -y clang-18 libclang-18-dev
          # ghostty-vt-sys/build.rs falls back to a plain `clang` on PATH
          # for resource-dir detection; llvm.sh doesn't register that
          # unversioned alternative by default.
          sudo ln -sf "$(command -v clang-18)" /usr/bin/clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Build
        # CMUX_GHOSTTY_VT_ZIG_CPU=baseline pins the zig VT-library build
        # to a portable CPU baseline instead of the GitHub runner's native
        # ISA. Without this, zig's default target detection selects
        # runner-native SIMD extensions (e.g. AVX-512 variants on
        # ubuntu-latest x86_64) that SIGILL on user CPUs lacking them —
        # the root cause of issue #58's "Host 1" SIGILL failure mode.
        # See ghostty-vt-sys/build.rs:50-57 for the -Dcpu mechanism.
        env:
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
          # Empty on workflow_dispatch; mux-core/build.rs treats an empty
          # value as unset and falls back to `git describe`.
          CMUX_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bootstrap.sh

      - name: Verify the baked-in version
        # Fail the release rather than publish a binary that lies about
        # what it is. This is the gate that makes issue #71 unable to
        # recur silently: every link in the chain (tag → CMUX_VERSION →
        # build.rs → mux_core::VERSION → `-V`) is exercised here.
        # Passed via env rather than interpolated into the script, so a
        # tag name can never be spliced into the shell.
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(mux/target/release/cmux --version)"
          echo "cmux reports: $reported"
          if [[ -n "$EXPECTED_VERSION" && "$reported" != "cmux $EXPECTED_VERSION" ]]; then
            echo "::error::expected 'cmux $EXPECTED_VERSION', got '$reported'"
            exit 1
          fi

      - name: Package binary
        run: |
          mkdir -p dist
          cp mux/target/release/cmux "dist/cmux-linux-${{ matrix.arch }}"
          chmod +x "dist/cmux-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cmux-linux-${{ matrix.arch }}
          path: dist/cmux-linux-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
